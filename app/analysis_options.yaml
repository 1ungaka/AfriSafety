include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Raw prints bypass SafeLogger's location redaction.
    avoid_print: error
    unawaited_futures: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
