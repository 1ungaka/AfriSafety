name: afrisafety
description: "AfriSafety: privacy-first personal safety and location sharing for South Africa."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  sodium: ^4.1.1+2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Font licences, registered with LicenseRegistry in bootstrap.dart.
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-BricolageGrotesque.txt

  # Bundled (not fetched at runtime) to save data and avoid a request to a
  # third party on every launch. SIL Open Font License 1.1.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
