name: afrisafety
description: "AfriSafety: privacy-first personal safety and location sharing for South Africa."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  battery_plus: ^7.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  # Pinned: 13.x pulls permission_handler_android 14.x, which needs Android
  # SDK 37 - newer than the Android Gradle Plugin bundled with Flutter 3.47
  # supports. 12.0.3 uses permission_handler_android 13.0.1 (SDK 35).
  permission_handler: 12.0.3
  share_plus: ^13.3.1
  sodium: ^4.1.1+2
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Font licences, registered with LicenseRegistry in bootstrap.dart.
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-BricolageGrotesque.txt

  # Bundled (not fetched at runtime) to save data and avoid a request to a
  # third party on every launch. SIL Open Font License 1.1.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
