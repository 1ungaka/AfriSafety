      <button aria-label="Sharing with Mama" aria-pressed="true" style="width: 52px; height: 32px; border: none; border-radius: 16px; background: #0E6B5C; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span></button>
