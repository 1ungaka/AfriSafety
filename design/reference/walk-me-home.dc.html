<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AfriSafety journey sharing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'DM Sans', system-ui, sans-serif; color: #0F1E1C; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 8px; padding: 20px 12px 8px">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F1E1C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 24px; font-weight: 700">Walk me home</h1>
  </div>

  <div style="position: relative; height: 260px; margin: 0 20px; border-radius: 20px; overflow: hidden; background: #E3EAE7">
    <svg width="350" height="260" viewBox="0 0 350 260" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <path d="M0 70 H350 M0 180 H350 M110 0 V260 M260 0 V260" stroke="#FFFFFF" stroke-width="10"></path>
      <path d="M50 210 L110 180 L110 110 L200 70 L280 60" fill="none" stroke="#0E6B5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M50 210 L110 180 L110 150" fill="none" stroke="#0E6B5C" stroke-width="6" stroke-opacity="0.35" stroke-linecap="round"></path>
      <circle cx="110" cy="140" r="11" fill="#0E6B5C" stroke="#FFFFFF" stroke-width="4"></circle>
      <circle cx="280" cy="60" r="12" fill="#E0A43A" stroke="#FFFFFF" stroke-width="4"></circle>
    </svg>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #3F4F4C">Heading to</span>
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 700">Home</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 14px; color: #3F4F4C">Arriving</span>
        <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 700; color: #0E6B5C">12 min</span>
      </div>
    </div>

    <div style="height: 8px; border-radius: 4px; background: #DCE3E1; overflow: hidden">
      <div style="width: 40%; height: 8px; background: #0E6B5C"></div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 15px">Watching your trip</span>
        <span style="font-size: 14px; color: #3F4F4C">Mama, Thabo</span>
      </div>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #C9D3D0; border-radius: 22px; background: #FFFFFF; font: 700 14px 'DM Sans', sans-serif; color: #0F1E1C">Edit</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 15px">Check-in timer</span>
        <span style="font-size: 14px; color: #3F4F4C">Alert my circle if I am not home by 21:30</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
    </div>

    <a href="Home.dc.html" style="margin-top: auto; min-height: 60px; border-radius: 16px; background: #0E6B5C; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none">
      <span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 20px; font-weight: 700">Ndifikile</span>
      <span style="font-size: 13px; color: #DCEDE8">I have arrived, stop sharing</span>
    </a>
    <a href="SOS.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C2410C; font-weight: 700; font-size: 15px; text-decoration: none">Something is wrong, send SOS</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
